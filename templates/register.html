<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AI Smart Crop Advisor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .auth-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(16, 24, 39, 0.9), rgba(27, 44, 48, 0.95)), url('/static/images/hero-bg.jpg') center/cover no-repeat;
            padding: 120px 20px 40px;
        }
        .auth-card {
            background: rgba(16, 25, 34, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .auth-title {
            font-family: var(--font-heading);
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .auth-subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
        }
        .auth-form .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .auth-form label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-light);
            font-weight: 500;
            font-size: 0.9rem;
        }
        .auth-form input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-light);
            font-family: var(--font-body);
            transition: all 0.3s ease;
        }
        .auth-form input:focus {
            border-color: var(--primary-color);
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }
        .auth-btn {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border-radius: 12px;
            font-size: 1.05rem;
        }
        .auth-links {
            margin-top: 20px;
            color: var(--text-muted);
        }
        .auth-links a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }
        .auth-links a:hover {
            text-decoration: underline;
        }
        .flash-messages {
            margin-bottom: 20px;
        }
        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container nav-inner">
            <a href="/" class="nav-logo" id="nav-logo">
                <div class="logo-icon">🌱</div>
                <span>AI Smart Crop Advisor</span>
            </a>
            <ul class="nav-links" id="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/#recommend">Predict</a></li>
                <li><a href="/login" class="btn btn-outline nav-cta">Login</a></li>
            </ul>
        </div>
    </nav>

    <section class="auth-section">
        <div class="auth-card">
            <h2 class="auth-title">Create Account</h2>
            <p class="auth-subtitle">Join us to save your farm predictions</p>
            
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="flash-messages">
                {% for message in messages %}
                  <div class="alert">{{ message }}</div>
                {% endfor %}
                </div>
              {% endif %}
            {% endwith %}

            <form class="auth-form" action="/register" method="POST">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a username" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" required>
                </div>
                <button type="submit" class="btn btn-primary auth-btn">Sign Up</button>
            </form>
            <div class="auth-links">
                Already have an account? <a href="/login">Log In</a>
            </div>
        </div>
    </section>
</body>
</html>
